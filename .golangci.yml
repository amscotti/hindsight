# golangci-lint v1 config. Keep the enabled set small and warning-free;
# `make lint` (and CI) must pass with zero issues.
run:
  timeout: 5m

linters:
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - misspell
    - unconvert
    - unparam
    - depguard

linters-settings:
  misspell:
    locale: US
  # Layer enforcement for ARCHITECTURE.md section 2. A forbidden import
  # fails `make lint` and CI. Root *.go (main wiring) is intentionally
  # unconstrained; every rule below scopes to its package dir.
  # NOTE on `files` patterns (verified against gobwas/glob v0.2.3, which
  # depguard v2.2.0 uses): matching is against the ABSOLUTE file path, a
  # leading `**/` is required, and a middle/trailing `/**/` matches one or
  # more dirs but NOT zero. So each package needs BOTH the flat form
  # (`**/<pkg>/*.go`) and the nested form (`**/<pkg>/**/*.go`). Do not
  # "simplify" these without re-running the probe check below.
  # Probe check: plant `import _ "database/sql"` in handlers/, `net/http`
  # in db/, `hindsight/db` in realtime/ — `make lint` must fail 3x.
  depguard:
    list-type: blacklist
    # Must be true: database/sql and net/http are stdlib, and two rules
    # below deny exactly those. Deny lists stay explicit, so nothing else
    # in GOROOT is affected.
    include-go-root: true
    rules:
      no-sql-outside-db:
        files:
          - '**/handlers/*.go'
          - '**/handlers/**/*.go'
          - '**/realtime/*.go'
          - '**/realtime/**/*.go'
          - '**/templates/*.go'
          - '**/templates/**/*.go'
        deny:
          - pkg: database/sql
            desc: SQL belongs in db/ only (handlers use store interfaces)
          - pkg: modernc.org/sqlite
            desc: sqlite driver belongs in db/ only
      no-text-template-in-handlers:
        files:
          - '**/handlers/*.go'
          - '**/handlers/**/*.go'
        deny:
          - pkg: text/template
            desc: text/template forbidden in handlers/ (render via templates/ only)
          - pkg: html/template
            desc: html/template forbidden in handlers/ (render via templates/ only; templ.Unsafe/template.HTML forbidden per section 8)
      db-persistence-only:
        files:
          - '**/db/*.go'
          - '**/db/**/*.go'
        deny:
          - pkg: hindsight/handlers
            desc: db must not depend on handlers (layer inversion)
          - pkg: hindsight/realtime
            desc: db must not depend on realtime (publish after commit, from handlers)
          - pkg: hindsight/templates
            desc: db must not depend on templates (handlers map rows to view models)
          - pkg: net/http
            desc: db must not serve HTTP
      broker-persistence-free:
        files:
          - '**/realtime/*.go'
          - '**/realtime/**/*.go'
        deny:
          - pkg: hindsight/db
            desc: broker is persistence-free (section 5 ring buffer is in-memory)
          - pkg: hindsight/handlers
            desc: broker must not depend on handlers (layer inversion)
          - pkg: hindsight/templates
            desc: broker carries opaque HTML strings, not template components
      templates-render-only:
        files:
          - '**/templates/*.go'
          - '**/templates/**/*.go'
        deny:
          - pkg: hindsight/db
            desc: templates render view models, never query the store
          - pkg: hindsight/realtime
            desc: templates never publish events
          - pkg: net/http
            desc: templates must not serve HTTP

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
